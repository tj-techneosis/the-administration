name: release

# A pushed v* tag builds every target, checks the archives on real Linux and
# macOS machines, and only then publishes the GitHub release. Run it by hand
# (Actions > release > Run workflow) for a dry run: everything but the publish.
# The black-box suite isn't run here: it needs tests/isolated.sh's private
# process namespace; run it before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to stamp into the dry-run build"
        default: "v0.0.0-dryrun"

# Read-only everywhere but the publish job, which alone writes the release.
permissions:
  contents: read

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The plugin's version and the tag must agree: upgrade compares them.
      - name: the tag matches the plugin's version
        if: github.ref_type == 'tag'
        run: |
          want=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin/.claude-plugin/plugin.json)
          [ "v$want" = "$VERSION" ] || { echo "tag $VERSION but plugin.json says $want" >&2; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: scripts/package.sh "$VERSION" dist
      # darwin/amd64 has no runner below to execute it on; check it is the
      # right kind of binary at least.
      - run: |
          tar -xzf dist/administration-darwin-amd64.tar.gz -C /tmp
          file /tmp/administration-darwin-amd64/build/administration | tee /dev/stderr | grep -q 'Mach-O 64-bit x86_64'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  verify:
    needs: package
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: macos-latest, platform: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: checksums
        run: cd dist && { sha256sum -c SHA256SUMS 2>/dev/null || shasum -a 256 -c SHA256SUMS; }
      - name: the archive's own binary, at the right version
        run: |
          tar -xzf dist/administration-${{ matrix.platform }}.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/administration-${{ matrix.platform }}/build/administration" version | tee /dev/stderr | grep -qF "$VERSION"
      # The one-liner, end to end, from these archives: download, checksum,
      # unpack, install.
      - name: install the way a person does
        run: |
          mkdir -p "$RUNNER_TEMP/releases/latest/download"
          cp dist/* "$RUNNER_TEMP/releases/latest/download/"
          export ADMINISTRATION_RELEASES="file://$RUNNER_TEMP/releases"
          sh -s -- --no-browser < install.sh
          ~/.local/bin/administration version | grep -qF "$VERSION"
          ~/.local/bin/administration guide | grep -q "The Administration"

  publish:
    needs: verify
    # Only a pushed tag publishes; a run by hand is a dry run, whatever ref
    # it was started on.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre=--prerelease ;; esac
          gh release create "$VERSION" dist/* --verify-tag --title "The Administration $VERSION" --generate-notes $pre
